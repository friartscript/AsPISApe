name: Build Multi-Plateforme (Windows EXE, Android APK, iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Workload
        run: dotnet workload install maui-windows
      - name: Publish Windows EXE
        run: dotnet publish -f net10.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsPISApe-Windows-EXE
          path: bin/Release/net10.0-windows10.0.19041.0/win10-x64/publish/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install MAUI Workload
        run: dotnet workload install maui-android
      - name: Publish Android APK
        run: dotnet publish -f net10.0-android -c Release -p:AndroidPackageFormat=apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AsPISApe-Android-APK
          path: bin/Release/net10.0-android/publish/*.apk

  build-ios:
    name: Build iOS (iPhone)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Workload
        run: dotnet workload install maui-ios
      - name: Build iOS App
        run: dotnet build -f net10.0-ios -c Release

